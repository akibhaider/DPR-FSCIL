    <text x="120" y="754" font-size="12" font-weight="bold" fill="#333">Reading the diagram:</text>
    <text x="120" y="772" font-size="11" fill="#444">Horizontal axis: publication year. Vertical lanes: three converging research streams that define the space our project operates in.</text>
    <text x="120" y="788" font-size="11" fill="#444">Bold borders: core must-read works. Dashed orange arrows indicate where prior work converges into the open problem we target.</text>
    <text x="120" y="802" font-size="11" fill="#444">The CBM lineage (red dashed line) is relevant because our proposed knowledge-anchoring must be distinguished from concept-bottleneck models.</text>
